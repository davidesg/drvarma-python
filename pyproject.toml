[build-system]
requires = ["setuptools>=77", "wheel", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "drvarma"
version = "0.1.6"
description = "Multivariate VARMA modelling — exact maximum-likelihood estimation, forecasting and diagnostics. Ships `sima`, an MCP server for LLM-driven VARMA analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["COPYING"]
authors = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords = [
    "VARMA", "vector ARMA", "time series", "forecasting", "multivariate",
    "exact maximum likelihood", "econometrics", "impulse response",
, "MCP", "sima", "MCP server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # cffi IS a runtime dependency, and leaving it out is what made the binary
    # wheels useless. A cffi API-mode extension imports `_cffi_backend` when it
    # loads; without the cffi package that import fails, `_engine.py` catches the
    # ImportError, and the compiled engine silently degrades to the pure-Python
    # fallback — on a wheel that exists precisely to avoid that.
    # Verified on 0.1.2 in a clean venv: `pip install drvarma` fetched the right
    # manylinux wheel and the engine still would not load ("No module named
    # '_cffi_backend'"); installing cffi alone fixed it, changing nothing else.
    # It is declared unconditionally: the pure wheel does not need it, but the
    # cost is one small universal wheel, and the alternative is an extension
    # that is present and unusable.
    "cffi>=1.15",
]

[project.urls]
Homepage = "https://github.com/davidesg/drvarma-python"
Repository = "https://github.com/davidesg/drvarma-python"
Issues = "https://github.com/davidesg/drvarma-python/issues"
# Documentation es el campo que PyPI muestra más arriba y faltaba.
Documentation = "https://github.com/davidesg/drvarma-python/tree/master/docs"
Changelog = "https://github.com/davidesg/drvarma-python/blob/master/CHANGELOG.md"

[project.scripts]
drvarma = "drvarma.cli:main"
sima = "drvarma.mcp_server:main"       # simultaneous VARMA MCP (pip install "drvarma[mcp]")

[project.optional-dependencies]
# Optional CFFI-compiled C engine (P1): pip install "drvarma[c-engine]"
c-engine = ["cffi>=1.15"]
plots = ["matplotlib>=3.6", "pyfug>=2.0"]
# HTML forecast reports (SPS / fuf format); add weasyprint for optional PDF.
forecast-report = ["jinja2>=3.0", "matplotlib>=3.6"]
# sima MCP server: FastMCP + ART (univariate seeding) + charts/reports.
# mcp<2 is NOT conservatism: mcp 2.0.0 REMOVED `mcp.server.fastmcp`, which is
# where FastMCP lives and what this server imports. An unbounded `mcp>=1.0`
# resolves to 2.x on any fresh install and sima then fails to import at all.
# Verified: 1.27.2 works, 2.0.0 raises ModuleNotFoundError.
mcp = ["mcp>=1.0,<2", "art-tseries>=0.1.3", "drvarma[plots,forecast-report]"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Binary wheels ──────────────────────────────────────────────────────────
# Until 0.1.1 this project published ONLY a py3-none-any wheel plus the sdist,
# on the assumption that "the engine builds from the sdist". It does not: pip
# prefers a matching wheel over building a source distribution, and
# py3-none-any matches everywhere. So every PyPI install silently ran the
# pure-Python fallback, even on machines with GSL and a compiler.
#
# The fix is the shape fue already uses: per-platform binary wheels WITH GSL
# bundled, plus the pure wheel as the last resort for platforms not built.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip  = "*-win32 *-manylinux_i686 pp*"

# Smoke-test every wheel: it must import, estimate, and report how the
# optimiser terminated. NOT the golden battery — exact log-likelihoods are
# platform/BLAS-sensitive, so pinning them across build targets would produce
# failures that say nothing about the wheel.
test-requires = ["pytest"]
test-command  = "pytest {project}/tests/test_smoke.py -q"

[tool.cibuildwheel.linux]
# manylinux_2_28 = AlmaLinux 8. auditwheel then bundles libgsl/libgslcblas into
# the wheel; they are not on the manylinux whitelist.
manylinux-x86_64-image  = "quay.io/pypa/manylinux_2_28_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64"
# Portable across manylinux (AlmaLinux -> dnf) and musllinux (Alpine -> apk):
# without the branch, musllinux fails with `dnf: not found`.
before-all = "if command -v dnf >/dev/null 2>&1; then dnf install -y gsl-devel; else apk add --no-cache gsl-dev; fi"

[tool.cibuildwheel.macos]
before-all = "brew install gsl"
# Native arch only: cross-building would link the runner's single-arch Homebrew
# GSL into the wrong architecture.
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
