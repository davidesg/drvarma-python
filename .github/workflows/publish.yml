name: Publish to PyPI

# Builds the sdist + pure-Python wheel and publishes to PyPI when a version tag
# (v*) is pushed.
#
# Auth: PyPI Trusted Publishing (OIDC) — no API token in secrets. Configure it
# once on PyPI: project → Settings → Publishing → add a GitHub publisher with
# this repo, workflow `publish.yml`, and environment `pypi`.
# (Alternative: drop the OIDC `permissions`/`environment` and pass
# `password: ${{ secrets.PYPI_API_TOKEN }}` to the publish step.)

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (pure-Python wheel + sdist)
        env:
          DRVARMA_NO_ENGINE: "1"        # py3-none-any wheel; engine builds from sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write                   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
